<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Mes Cours</title>
</head>
<body>
    <main class="container" role="main" id="main-content">
        <nav aria-label="Fil d'Ariane" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">Accueil</a></li>
                <li class="breadcrumb-item active" aria-current="page">Mes Cours</li>
            </ol>
        </nav>
        
        <h2 class="mb-4">Mes Cours</h2>
        
        <div class="row g-3">
            <div class="col-md-6" *ngFor="let cours of cours">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ cours.titre }}</h5>
                        <p class="text-secondary small mb-2">{{ cours.enseignant }}</p>
                        <p class="card-text">{{ cours.description }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-success">{{ cours.statut }}</span>
                            <button class="btn btn-sm btn-primary" (click)="consulterCours(cours)">
                                <i class="bi bi-download me-1"></i>Consulter
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle me-2" aria-hidden="true"></i>
                    <span id="toastMessage"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fermer"></button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
