<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Changer mot de passe</title>
</head>
<body>
    <div class="container" style="padding-top: 80px !important;">
        <!-- Fil d'Ariane -->
        <nav aria-label="Fil d'Ariane" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">Accueil</a></li>
                <li class="breadcrumb-item active" aria-current="page">Changer mot de passe</li>
            </ol>
        </nav>
        
        <h2 class="mb-4">Changer mot de passe</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Mot de passe actuel</label>
                                <input type="password" class="form-control" placeholder="Entrez votre mot de passe actuel">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nouveau mot de passe</label>
                                <input type="password" class="form-control" placeholder="Entrez le nouveau mot de passe">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirmer le mot de passe</label>
                                <input type="password" class="form-control" placeholder="Confirmez le nouveau mot de passe">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Modifier le mot de passe</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
