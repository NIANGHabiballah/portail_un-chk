<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Paramètres</title>
</head>
<body>
    <main class="container" role="main" id="main-content">
        <!-- Fil d'Ariane -->
        <nav aria-label="Fil d'Ariane" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">Accueil</a></li>
                <li class="breadcrumb-item active" aria-current="page">Paramètres</li>
            </ol>
        </nav>
        
        <h2 class="mb-4">Paramètres</h2>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Notifications</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="notifEmail" checked>
                            <label class="form-check-label" for="notifEmail">Recevoir les notifications par email</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="notifAnnonces" checked>
                            <label class="form-check-label" for="notifAnnonces">Notifications des annonces</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="notifMessages" checked>
                            <label class="form-check-label" for="notifMessages">Notifications des messages</label>
                        </div>
                    </div>
                </div>
                
                <div class="card shadow-sm mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Langue et région</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Langue</label>
                            <select class="form-control">
                                <option selected>Français</option>
                                <option>English</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fuseau horaire</label>
                            <select class="form-control">
                                <option selected>GMT+0 (Dakar)</option>
                                <option>GMT+1 (Paris)</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-primary">Enregistrer les modifications</button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
