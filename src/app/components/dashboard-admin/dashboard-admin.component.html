<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Dashboard Admin</title>
</head>
<body>
    <main class="container" role="main" id="main-content">
        <nav aria-label="Fil d'Ariane" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active" aria-current="page">
                    <i class="bi bi-house-door me-1"></i>
                    Accueil Admin
                </li>
            </ol>
        </nav>

        <div class="welcome-section mb-4">
            <h1 class="h2 mb-2">
                <i class="bi bi-shield-check text-danger"></i>
                Tableau de bord Administrateur
            </h1>
            <p class="text-secondary">Gérez l'ensemble du portail UN-CHK</p>
        </div>

        <!-- Statistiques globales -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="h6 text-secondary">Étudiants</h3>
                        <p class="h3 mb-0 text-primary">1,245</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="h6 text-secondary">Enseignants</h3>
                        <p class="h3 mb-0 text-success">87</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="h6 text-secondary">Cours actifs</h3>
                        <p class="h3 mb-0 text-warning">156</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="h6 text-secondary">Demandes</h3>
                        <p class="h3 mb-0 text-danger">23</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions rapides -->
        <section class="mb-4">
            <h2 class="h4 mb-3">Actions rapides</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <a href="/etudiant" class="card border-0 shadow-sm text-decoration-none">
                        <div class="card-body text-center">
                            <i class="bi bi-people fs-1 text-primary mb-2"></i>
                            <h3 class="h6 mb-0">Gérer les utilisateurs</h3>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/administration" class="card border-0 shadow-sm text-decoration-none">
                        <div class="card-body text-center">
                            <i class="bi bi-file-earmark-check fs-1 text-success mb-2"></i>
                            <h3 class="h6 mb-0">Traiter les demandes</h3>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/communication" class="card border-0 shadow-sm text-decoration-none">
                        <div class="card-body text-center">
                            <i class="bi bi-megaphone fs-1 text-warning mb-2"></i>
                            <h3 class="h6 mb-0">Publier une annonce</h3>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
