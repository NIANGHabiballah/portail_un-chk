<main class="container mt-4" role="main">
  <nav aria-label="Fil d'Ariane" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/dashboard-enseignant">Accueil</a></li>
      <li class="breadcrumb-item active" aria-current="page">Saisir les notes</li>
    </ol>
  </nav>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2"><i class="bi bi-clipboard-check text-success"></i> Saisir les notes</h1>
    <div class="d-flex gap-2">
      <div class="alert alert-info mb-0 py-2 px-3">
        <strong>Moyenne classe :</strong> {{ moyenneClasse }}/20
      </div>
      <button class="btn btn-outline-primary" (click)="exportCSV()">
        <i class="bi bi-download"></i> Exporter CSV
      </button>
      <button class="btn btn-success" (click)="saveNotes()">
        <i class="bi bi-save"></i> Enregistrer
      </button>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <label class="form-label">Cours</label>
      <select class="form-select" [(ngModel)]="coursSelectionne" (change)="loadEtudiants()">
        <option value="IHM-M2">Interaction Homme-Machine (M2)</option>
        <option value="BDA-M2">Base de Données Avancées (M2)</option>
        <option value="DEV-L3">Développement Web (L3)</option>
        <option value="GL-M1">Génie Logiciel (M1)</option>
      </select>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Matricule</th>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Note /20</th>
              <th>Appréciation</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let etudiant of etudiants">
              <td>{{ etudiant.matricule }}</td>
              <td>{{ etudiant.nom }}</td>
              <td>{{ etudiant.prenom }}</td>
              <td>
                <input 
                  type="number" 
                  class="form-control" 
                  [(ngModel)]="etudiant.note" 
                  (ngModelChange)="updateAppreciation(etudiant)"
                  min="0" 
                  max="20" 
                  step="0.5"
                  placeholder="Note"
                  style="max-width: 100px;">
              </td>
              <td>
                <span class="badge" 
                      [class.bg-success]="etudiant.note && etudiant.note >= 16"
                      [class.bg-primary]="etudiant.note && etudiant.note >= 14 && etudiant.note < 16"
                      [class.bg-info]="etudiant.note && etudiant.note >= 12 && etudiant.note < 14"
                      [class.bg-warning]="etudiant.note && etudiant.note >= 10 && etudiant.note < 12"
                      [class.bg-danger]="etudiant.note && etudiant.note < 10">
                  {{ etudiant.appreciation || '-' }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
